<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TriMATHalon</title><link rel="stylesheet" href="style.css?v=12"></head><body><main id="app">
<section id="menu" class="screen active"><div class="card hero"><p class="eyebrow">THE ULTIMATE NUMBERS TRIATHLON</p><h1>Tri<span>MATH</span>alon</h1><p class="tagline">Swim. Pedal. Sprint. Solve!</p><canvas id="menuCanvas" width="900" height="310"></canvas><div class="pb">PERSONAL BEST <strong id="menuBest">No time yet</strong></div><button id="startButton" class="primary">Start Race ▶</button><p class="hint">Answer with your mouse or keys 1–4</p></div></section>
<section id="race" class="screen"><header><div><p id="legLabel" class="eyebrow">LEG 1 OF 3</p><h2 id="legName">SWIM • ADDITION</h2></div><div class="clock"><small>RACE TIME</small><strong id="timer">0:00.0</strong></div></header><div class="progress-track"><div id="progressFill" class="progress-fill"></div><span id="progressLabel" class="progress-label">0%</span></div><canvas id="raceCanvas" width="1000" height="500"></canvas><div id="transition" class="transition"></div><aside id="scoreboard"></aside><div class="question-card"><p class="eyebrow">SOLVE TO SURGE AHEAD!</p><div id="question" class="question"></div><div id="answers" class="answers"></div><p id="feedback" aria-live="polite"></p></div><p id="debugInfo" style="text-align:center;font:700 11px monospace;color:#5b7285;margin:8px 0 0"></p></section>
<section id="results" class="screen"><div class="card results-card"><p class="eyebrow">RACE COMPLETE!</p><h1>Finish <span>Line</span></h1><div id="newBest" class="new-best" hidden>★ New Personal Best! ★</div><canvas id="podiumCanvas" width="850" height="300"></canvas><div id="standings" class="standings"></div><section class="review"><h2>Your Math Review</h2><div id="accuracy" class="stat-grid"></div><div id="questionReview" class="question-review"></div></section><button id="continueButton" class="primary">Continue</button></div></section>
</main><script src="js/storage.js?v=12"></script><script src="js/questions.js?v=12"></script><script src="js/racers.js?v=12"></script><script src="js/audio.js?v=12"></script><script src="js/menu.js?v=12"></script><script src="js/race.js?v=12"></script><script src="js/results.js?v=12"></script><script src="js/main.js?v=12"></script></body></html>
